# Two targets and one set of models. duckdb is the one that runs here, because
# there is no Snowflake account behind this repository. The snowflake target is
# declared so the project parses against the adapter it is written for and so
# the resolved relation names can be compared between the two.
subevents:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('SUBEVENTS_DUCKDB', '/tmp/subevents.duckdb') }}"
      schema: main
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SUBEVENTS_SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SUBEVENTS_SNOWFLAKE_USER', 'unset') }}"
      private_key_path: "{{ env_var('SUBEVENTS_SNOWFLAKE_KEY_PATH', '/dev/null') }}"
      role: DBT_TRANSFORMER_ROLE
      warehouse: SUBEVENTS_TRANSFORM_WH
      database: SUBEVENTS
      schema: ANALYTICS
      threads: 4
